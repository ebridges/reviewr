name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0 # no major-version tags since v8
      # The tests make commits in temporary repos.
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: uv sync
      - run: uv run ruff check reviewr tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # Type-checks (tsc -b) and builds.
      - run: npm --prefix frontend run build

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version files agree
        run: node scripts/release.mjs --check "v$(node -p 'require("./package.json").version')"
