[project]
name = "reviewr"
version = "0.1.0"
description = "Review and respond to comments on very large pull requests"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "claude-agent-sdk>=0.2.183",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[project.scripts]
reviewr = "reviewr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewr"]

[tool.ruff]
line-length = 100
