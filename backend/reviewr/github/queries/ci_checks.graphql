query($owner:String!,$repo:String!,$number:Int!){
  repository(owner:$owner,name:$repo){ pullRequest(number:$number){ headRefOid
    commits(last:1){nodes{commit{oid statusCheckRollup{state contexts(first:100){nodes{
      __typename
      ... on CheckRun{databaseId name status conclusion detailsUrl startedAt completedAt isRequired(pullRequestNumber:$number)
        checkSuite{workflowRun{databaseId runNumber workflow{name}}}
        annotations(first:20){nodes{path title message annotationLevel location{start{line} end{line}}}}}
      ... on StatusContext{context state targetUrl description}
    }}}}}}}}
  rateLimit{cost remaining resetAt}
}
