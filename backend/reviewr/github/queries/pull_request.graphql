# PR metadata plus one page of review threads. Paginate with $threadsAfter.
query PullRequest($owner: String!, $repo: String!, $number: Int!, $threadsAfter: String) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      id
      title
      url
      author { login }
      baseRefName
      headRefName
      baseRefOid
      headRefOid
      changedFiles
      latestReviews(first: 50) {
        nodes { state author { login ... on User { id } } }
      }
      reviewThreads(first: 100, after: $threadsAfter) {
        pageInfo { hasNextPage endCursor }
        nodes {
          id
          path
          line
          originalLine
          startLine
          diffSide
          isResolved
          isOutdated
          comments(first: 100) {
            pageInfo { hasNextPage }
            nodes { id author { login } body createdAt url diffHunk originalCommit { oid } }
          }
        }
      }
    }
  }
  rateLimit { cost remaining resetAt }
}
